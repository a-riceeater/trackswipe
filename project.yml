name: TrackEdge
options:
  bundleIdPrefix: dev.trackedge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    # Sparkle compares this build number; it must increase with every release.
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  TrackEdge:
    type: application
    platform: macOS
    sources:
      - path: TrackEdge
        excludes:
          - "**/*.md"
    dependencies:
      - package: Sparkle
    info:
      path: TrackEdge/Resources/Info.plist
      properties:
        CFBundleDisplayName: TrackEdge
        CFBundleName: TrackEdge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 TrackEdge contributors. Apache License 2.0."
        NSPrincipalClass: NSApplication
        # Sparkle auto-updates. The appcast lives in the repo; archives are GitHub release assets.
        SUFeedURL: https://raw.githubusercontent.com/a-riceeater/trackswipe/main/appcast.xml
        SUPublicEDKey: E9S5B6AWYuKhpWQt+Y5Qy6N7sWiPEN/mrbYNKLafzVM=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    settings:
      configs:
        # Debug builds are ad-hoc signed; a separate bundle ID keeps their Accessibility grant,
        # preferences and login item from colliding with the signed release app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.trackedge.TrackEdge.debug
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trackedge.TrackEdge
        PRODUCT_NAME: TrackEdge
        SWIFT_OBJC_BRIDGING_HEADER: TrackEdge/Bridging/TrackEdge-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: TrackEdge/Resources/TrackEdge.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  TrackEdgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TrackEdgeTests
    dependencies:
      - target: TrackEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trackedge.TrackEdgeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TrackEdge.app/Contents/MacOS/TrackEdge
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  TrackEdge:
    build:
      targets:
        TrackEdge: all
        TrackEdgeTests: [test]
    test:
      targets:
        - TrackEdgeTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
