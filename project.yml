name: TrackEdge
options:
  bundleIdPrefix: dev.trackedge
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  TrackEdge:
    type: application
    platform: macOS
    sources:
      - path: TrackEdge
        excludes:
          - "**/*.md"
    info:
      path: TrackEdge/Resources/Info.plist
      properties:
        CFBundleDisplayName: TrackEdge
        CFBundleName: TrackEdge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 TrackEdge contributors. Apache License 2.0."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trackedge.TrackEdge
        PRODUCT_NAME: TrackEdge
        SWIFT_OBJC_BRIDGING_HEADER: TrackEdge/Bridging/TrackEdge-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: TrackEdge/Resources/TrackEdge.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  TrackEdgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TrackEdgeTests
    dependencies:
      - target: TrackEdge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trackedge.TrackEdgeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TrackEdge.app/Contents/MacOS/TrackEdge
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  TrackEdge:
    build:
      targets:
        TrackEdge: all
        TrackEdgeTests: [test]
    test:
      targets:
        - TrackEdgeTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
